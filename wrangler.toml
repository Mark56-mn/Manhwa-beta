# Manhwa Studio API — Cloudflare Worker (blueprint TASK 06 foundation)
#
# Environment separation conventions:
#   - [vars]    : non-secret public configuration only (never credentials).
#   - Secrets   : set with `wrangler secret put <NAME>`; values never touch this
#                 file or the repository (store them in the platform secret
#                 manager or the gitignored .env.local for local use).
#   - Bindings  : declared here only once the resource exists and is verified.
#                 Never claim D1/R2 is connected before a real query succeeds.

name = "manhwa-studio-api"
main = "worker/src/index.ts"
compatibility_date = "2025-09-01"
account_id = "78bd087d85c6604c2dc25195a80eac91"

# D1 (created 19 Oct 2026, region WNAM; migrations in ./migrations)
[[d1_databases]]
binding = "DB"
database_name = "manhwa-studio"
database_id = "d9557398-b439-463a-b5aa-a3703d5c3fdb"

# R2 — enabled 19 Oct 2026 (account-level R2 subscription activated by owner).
# Bucket `manhwa-studio-assets` created 19 Oct 2026 (WNAM, Standard) on account
# `78bd087d85c6604c2dc25195a80eac91`. A real list call now returns 200.
[[r2_buckets]]
binding = "FILES"
bucket_name = "manhwa-studio-assets"

# Sign in with Freebuff — public config, no secrets. Register with the owner's
# Freebuff login (`npx @freebuff/auth register ...`) or Freebuff Desktop, then
# set as wrangler [vars] or `wrangler secret`-free deployment vars:
# [vars]
# FREEBUFF_CLIENT_ID = "<from provisioning>"
# FREEBUFF_ISSUER    = "<from provisioning>"
# APP_ORIGIN         = "https://<deployed-origin>"
