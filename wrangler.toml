# Manhwa Studio API — Cloudflare Worker (blueprint TASK 06 foundation)
#
# Environment separation conventions:
#   - [vars]    : non-secret public configuration only (never credentials).
#   - Secrets   : set with `wrangler secret put <NAME>`; values never touch this
#                 file or the repository (store them in the platform secret
#                 manager or the gitignored .env.local for local use).
#   - Bindings  : declared here only once the resource exists and is verified.
#                 Never claim D1/R2 is connected before a real query succeeds.

name = "manhwa-studio-api"
main = "worker/src/index.ts"
compatibility_date = "2025-09-01"
account_id = "78bd087d85c6604c2dc25195a80eac91"

# D1 (created 19 Oct 2026, region WNAM).
#
# `migrations_dir` deliberately points at `db/migrations` instead of the default
# `migrations/`. That legacy directory holds an untracked duplicate
# (`0002_assets.sql`) which sorts BEFORE the tracked `0002` and aborts the whole
# apply on a database that already has `assets`. The untracked file is the
# owner's and is deliberately left exactly where it is; the deploy path simply
# no longer reads it. Verified with `wrangler d1 migrations list` (TASK 10).
[[d1_databases]]
binding = "DB"
database_name = "manhwa-studio"
database_id = "d9557398-b439-463a-b5aa-a3703d5c3fdb"
migrations_dir = "db/migrations"

# R2 — enabled 19 Oct 2026 (account-level R2 subscription activated by owner).
# Bucket `manhwa-studio-assets` created 19 Oct 2026 (WNAM, Standard) on account
# `78bd087d85c6604c2dc25195a80eac91`. A real list call now returns 200.
[[r2_buckets]]
binding = "FILES"
bucket_name = "manhwa-studio-assets"

# ── Public configuration (TASK 09) ───────────────────────────────────────────
# None of these is a secret, so all of them belong in [vars]. Values are set by
# the owner once the deployment origin exists; this file never invents one.
#
# [vars]
# SUPABASE_URL    = "https://<project>.supabase.co"   # auth: token verification
# APP_ORIGIN      = "https://<the API's own origin>"
# ALLOWED_ORIGINS = "https://<frontend origin>,https://<preview origin>"
#
# APP_ORIGIN is the first CORS allow-list entry, so it must be this Worker's own
# origin. SUPABASE_URL must be a bare origin: the API builds
# <SUPABASE_URL>/auth/v1/.well-known/jwks.json from it and reports
# `auth_not_configured` (503) for anything with a path.
#
# Sign in with Freebuff is retired (TASK 11). The browser talks to Supabase Auth
# directly; this Worker only verifies the access token it receives as
# `Authorization: Bearer`. TASK 11 requires the frontend origin in
# ALLOWED_ORIGINS *and* `Authorization` in the preflight allow-list — both are
# already in the code (worker/src/origins.ts). ALLOWED_ORIGINS lists the extra EXACT
# origins a separately hosted frontend is served from — wildcards are
# impossible by design (worker/src/origins.ts), because the browser sends the
# session cookie with these requests.
#
# Secrets (never here, never in a Vite variable):
#   bunx wrangler secret put GEMINI_API_KEY
#   bunx wrangler secret put GEMINI_MODEL      # generation needs BOTH
#   bunx wrangler secret put SUPABASE_JWT_SECRET        # legacy HS256 projects only
#   bunx wrangler secret put SUPABASE_SERVICE_ROLE_KEY  # optional secondary backup only
#
# First-use organizations need no configuration: worker/src/provisioning.ts
# derives exactly one workspace per verified Supabase `sub` (a UUID) on first
# request. No migration was added: `users.id` is TEXT and accepts a UUID.
#
# Hostname: this account has no workers.dev subdomain yet, so a deploy reports
# the script without a public URL. Create the subdomain once in Workers & Pages,
# or attach a custom domain from the active `oppa-technologies.online` zone.
