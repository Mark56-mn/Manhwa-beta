name: CI

# Quality gates for Manhwa Studio (blueprint TASK 05).
#
# Verification status (TASK 01, 22 October 2026):
# - These four steps were reproduced locally on the integration commit and all
#   passed: frozen install, typecheck, 59 tests, production build.
# - The only GitHub Actions run so far (run 39372282697, branch
#   task/TASK-07-d1-tenancy-foundation) **never started**: GitHub reported
#   "The job was not started because your account is locked due to a billing
#   issue." No step executed, so there is still no green CI run on record.
#   CI can only go green once the owner resolves the Actions billing lock.
#
# Do not report CI as passing until a real run is observed green.
#
# Bun is pinned deliberately: `bun.lock` is `lockfileVersion: 2`, which requires
# Bun >= 1.4. Older Bun (1.3.x) fails the install with "Unknown lockfile
# version", so `bun-version: latest` would make the gate depend on whatever the
# runner resolves that day.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    name: install → lint → test → build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Bun version
        run: bun --version

      - name: Install dependencies (lockfile-frozen)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build
